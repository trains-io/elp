---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: z21devices.z21.trains.io
spec:
  group: z21.trains.io
  names:
    kind: Z21Device
    listKind: Z21DeviceList
    plural: z21devices
    shortNames:
    - z21
    singular: z21device
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.backend.type
      name: Backend
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.conditions[?(@.type=="GatewayReady")].status
      name: Gateway
      type: string
    - jsonPath: .status.conditions[?(@.type=="DeviceReachable")].status
      name: Reachable
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Z21Device represents a physical or virtual Z21 command station
          managed in-cluster.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          spec:
            description: Z21DeviceSpec defines the desired state of a Z21 command
              station reachable from the cluster.
            properties:
              backend:
                description: Backend selects hardware on the LAN or an in-cluster
                  z21 simulator.
                properties:
                  hardware:
                    description: Hardware is required when type is hardware.
                    properties:
                      host:
                        description: Host is the command station IP address or resolvable
                          hostname.
                        minLength: 1
                        type: string
                      port:
                        description: Port is the Z21 UDP port. Defaults to 21105.
                        format: int32
                        maximum: 65535
                        minimum: 1
                        type: integer
                    required:
                    - host
                    type: object
                  simulator:
                    description: Simulator is optional when type is simulator.
                    properties:
                      image:
                        description: Image is the simulator container image.
                        type: string
                    type: object
                  type:
                    description: Type is hardware for a LAN-connected command station
                      or simulator for z21-sim.
                    enum:
                    - hardware
                    - simulator
                    type: string
                required:
                - type
                type: object
              broadcastFlags:
                description: |-
                  BroadcastFlags is the LAN_SET_BROADCASTFLAGS bitmask (spec §2.16).
                  When unset the gateway uses 0x00000101 (XpressNet + system state).
                format: int32
                type: integer
              canAddressPoolRef:
                description: CANAddressPoolRef names the CANAddressPool used for module
                  address allocation.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              gateway:
                description: Gateway configures the gateway Deployment reconciled
                  for this device.
                properties:
                  hostAliases:
                    description: HostAliases adds static /etc/hosts entries on the
                      gateway pod.
                    items:
                      description: |-
                        HostAlias holds the mapping between IP and hostnames that will be injected as an entry in the
                        pod's hosts file.
                      properties:
                        hostnames:
                          description: Hostnames for the above IP address.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                        ip:
                          description: IP address of the host file entry.
                          type: string
                      required:
                      - ip
                      type: object
                    type: array
                  hostNetwork:
                    description: HostNetwork runs the gateway pod with host networking
                      for LAN reachability.
                    type: boolean
                  image:
                    description: Image is the gateway container image. When empty
                      a controller default is used.
                    type: string
                  nodeSelector:
                    additionalProperties:
                      type: string
                    description: NodeSelector schedules the gateway onto nodes that
                      can reach the device.
                    type: object
                type: object
              healthCheck:
                description: HealthCheck configures gateway device reachability probing.
                properties:
                  failureThreshold:
                    description: FailureThreshold is the number of consecutive failures
                      before DeviceReachable becomes False.
                    format: int32
                    type: integer
                  interval:
                    description: Interval between probe attempts.
                    type: string
                  successThreshold:
                    description: SuccessThreshold is the number of consecutive successes
                      before DeviceReachable becomes True.
                    format: int32
                    type: integer
                  timeout:
                    description: Timeout for a single probe attempt.
                    type: string
                type: object
              nats:
                description: NATS configures how the gateway publishes device events.
                properties:
                  subjectPrefix:
                    description: |-
                      SubjectPrefix is prepended to published subjects. When empty the controller
                      defaults to "z21.<namespace>.<name>".
                    type: string
                  url:
                    description: URL is the NATS server URL, for example "nats://nats.nats.svc:4222".
                    minLength: 1
                    type: string
                required:
                - url
                type: object
            required:
            - backend
            - nats
            type: object
          status:
            description: Z21DeviceStatus defines the observed state of Z21Device.
            properties:
              conditions:
                description: Conditions report gateway readiness and device connectivity.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              firmwareVersion:
                description: FirmwareVersion is the Z21 firmware version string reported
                  by the gateway.
                type: string
              gatewayDeployment:
                description: GatewayDeployment is the name of the reconciled gateway
                  Deployment.
                type: string
              hardwareType:
                description: HardwareType is the Z21 hardware type from LAN_GET_HWINFO
                  (hex string).
                type: string
              healthCheckFailures:
                description: HealthCheckFailures is the current consecutive failed
                  probe count.
                format: int32
                type: integer
              lastSeen:
                description: LastSeen is the last time the gateway reported a successful
                  Z21 interaction.
                format: date-time
                type: string
              lastSuccessfulHealthCheck:
                description: LastSuccessfulHealthCheck is updated by the gateway after
                  a successful probe.
                format: date-time
                type: string
              lockCode:
                description: LockCode is the LAN_GET_CODE feature lock byte (0 = no
                  lock, 1 = z21 start locked, 2 = unlocked).
                type: integer
              observedGeneration:
                description: ObservedGeneration reflects the generation of the spec
                  the controller reconciled.
                format: int64
                type: integer
              phase:
                description: Phase is the high-level gateway lifecycle state.
                type: string
              serialNumber:
                description: SerialNumber is the Z21 hardware serial reported by the
                  gateway.
                type: string
              simulatorDeployment:
                description: SimulatorDeployment is the name of the reconciled simulator
                  Deployment.
                type: string
              simulatorService:
                description: SimulatorService is the ClusterIP Service fronting the
                  simulator.
                type: string
              xbusFirmwareVersion:
                description: XBusFirmwareVersion is the X-Bus firmware version from
                  LAN_X_GET_FIRMWARE_VERSION.
                type: string
              xbusVersion:
                description: XBusVersion is the X-Bus protocol version from LAN_X_GET_VERSION.
                type: string
            type: object
        type: object
        x-kubernetes-validations:
        - message: backend.hardware is required when backend.type is hardware
          rule: self.backend.type != 'hardware' || has(self.backend.hardware)
        - message: backend.hardware must not be set when backend.type is simulator
          rule: self.backend.type != 'simulator' || !has(self.backend.hardware)
    served: true
    storage: true
    subresources:
      status: {}
