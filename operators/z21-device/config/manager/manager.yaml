apiVersion: v1
kind: Namespace
metadata:
  name: system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
  labels:
    app.kubernetes.io/name: z21-device-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: z21-device-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: z21-device-controller
    spec:
      serviceAccountName: controller-manager
      containers:
        - name: manager
          image: ghcr.io/trains-io/z21-device-controller:latest
          imagePullPolicy: IfNotPresent
          args:
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=0
            - --gateway-image=ghcr.io/trains-io/z21-gateway:latest
          ports:
            - name: health
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
