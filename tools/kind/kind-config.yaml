# Local dev cluster for the elp operator and gateways.
# Cluster name is set by: make kind-up (default: elp).
# host.docker.internal is configured post-create (see make kind-configure-host).
#
# Pin a stable node image (kind defaults may pull a bleeding-edge k8s that fails on WSL2).
# Override: KIND_NODE_IMAGE=kindest/node:v1.32.11@sha256:... make kind-up
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    image: kindest/node:v1.32.11@sha256:5fc52d52a7b9574015299724bd68f183702956aa4a2116ae75a63cb574b35af8
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "trains.io/edge=true"
